<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Buddy — History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'JetBrains Mono', monospace; background: #0d1117; color: #e6edf3; padding: 2rem; }
    nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
    nav a { font-size: 0.8rem; color: #8b949e; text-decoration: none; letter-spacing: 0.05em; }
    nav a.active { color: #7ee787; }
    nav a:hover { color: #e6edf3; }
    h1 { font-size: 1.2rem; font-weight: 500; color: #7ee787; margin-bottom: 2rem; letter-spacing: 0.05em; }
    .session-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 0.5rem; overflow: hidden; }
    .session-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; cursor: pointer; user-select: none; }
    .session-header:hover { background: #1c2128; }
    .session-left { display: flex; align-items: center; gap: 0.75rem; }
    .session-chevron { font-size: 0.6rem; color: #484f58; transition: transform 0.2s; display: inline-block; }
    .session-chevron.open { transform: rotate(90deg); }
    .session-id { font-size: 0.8rem; font-weight: 500; color: #e6edf3; }
    .session-time { font-size: 0.7rem; color: #484f58; }
    .session-stats { display: flex; gap: 1.5rem; }
    .stat .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat .value { font-size: 1.1rem; font-weight: 500; }
    .green { color: #7ee787; } .red { color: #f85149; } .yellow { color: #e3b341; } .muted { color: #8b949e; }
    .focus-bar { height: 3px; background: #21262d; }
    .focus-fill { height: 100%; background: #7ee787; }
    .session-logs { border-top: 1px solid #21262d; display: none; }
    .app-group { background: #0d1117; border-bottom: 1px solid #21262d; }
    .app-group:last-child { border-bottom: none; }
    .app-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1.25rem; cursor: pointer; user-select: none; }
    .app-row:hover { background: #161b22; }
    .app-chevron { font-size: 0.6rem; color: #484f58; transition: transform 0.2s; display: inline-block; }
    .app-chevron.open { transform: rotate(90deg); }
    .app-name { font-size: 0.8rem; font-weight: 500; color: #e6edf3; flex: 1; }
    .app-switch-count { font-size: 0.7rem; color: #8b949e; }
    .window-list { display: none; }
    .window-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 1.25rem 0.55rem 2.75rem; border-top: 1px solid #161b22; }
    .window-row:hover { background: #161b22; }
    .window-header { display: flex; align-items: center; gap: 0.75rem; flex: 1; cursor: pointer; min-width: 0; }
    .window-chevron { font-size: 0.55rem; color: #484f58; transition: transform 0.2s; display: inline-block; flex-shrink: 0; }
    .window-chevron.open { transform: rotate(90deg); }
    .window-title { font-size: 0.75rem; color: #8b949e; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .window-switch-count { font-size: 0.7rem; color: #484f58; min-width: 28px; text-align: right; flex-shrink: 0; }
    .timestamp-list { display: none; background: #0a0e13; }
    .ts-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.4rem 1.25rem 0.4rem 4.25rem; border-top: 1px solid #161b22; }
    .ts-dot { width: 5px; height: 5px; border-radius: 50%; background: #30363d; flex-shrink: 0; }
    .ts-time { font-size: 0.7rem; color: #484f58; min-width: 75px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; }
    .badge.study { background: #1a3a2a; color: #7ee787; }
    .badge.distract { background: #3a1a1a; color: #f85149; }
    .badge.mixed { background: #2a2510; color: #e3b341; }
    .badge.mismatch { background: #3a2a10; color: #e3b341; }
    .btn-group { display: flex; gap: 0.3rem; margin-left: auto; flex-shrink: 0; }
    .btn { padding: 2px 8px; border-radius: 4px; font-size: 0.62rem; font-family: inherit; cursor: pointer; border: 1px solid transparent; background: transparent; }
    .btn-study { color: #7ee787; border-color: #1a3a2a; }
    .btn-study:hover, .btn-study.active { background: #1a3a2a; }
    .btn-distract { color: #f85149; border-color: #3a1a1a; }
    .btn-distract:hover, .btn-distract.active { background: #3a1a1a; }
    .loading { color: #484f58; font-size: 0.75rem; padding: 1rem 1.25rem; }
    .empty { color: #484f58; font-size: 0.8rem; padding: 2rem; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="/dashboard">dashboard</a>
    <a href="/history" class="active">history</a>
  </nav>
  <h1>study_buddy / history</h1>
  <div id="sessions-list"></div>

  <script>
    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function duration(start, end) {
      if (!start || !end) return '—';
      const diff = Math.floor((new Date(end) - new Date(start)) / 1000);
      const m = Math.floor(diff / 60), s = diff % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function dominantLabel(entries) {
      const labels = entries.map(e => e.user_label || e.predicted_label);
      const s = labels.filter(l => l === 'study').length;
      const d = labels.filter(l => l === 'distract').length;
      if (s > 0 && d > 0) return 'mixed';
      return s > 0 ? 'study' : 'distract';
    }

    function groupLogs(rows) {
      const appMap = {};
      rows.forEach(row => {
        if (!appMap[row.app_name]) appMap[row.app_name] = { name: row.app_name, windows: {} };
        if (!appMap[row.app_name].windows[row.window_title]) appMap[row.app_name].windows[row.window_title] = { title: row.window_title, entries: [] };
        appMap[row.app_name].windows[row.window_title].entries.push(row);
      });
      return appMap;
    }

    function applyLabel(e, logId, label, tsRow) {
      e.stopPropagation();
      fetch('/label', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: logId, label })
      }).then(r => r.json()).then(d => {
        if (d.success) {
          const mismatch = label !== tsRow.dataset.predicted;
          const badge = tsRow.querySelector('.ts-badge');
          badge.className = `badge ts-badge ${mismatch ? 'mismatch' : label}`;
          badge.textContent = label + (mismatch ? ' !' : '');
          tsRow.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
          tsRow.querySelector(`.btn-${label}`).classList.add('active');
        }
      });
    }

    function bulkLabel(e, sessionId, windowTitle, label, winGroup) {
      e.stopPropagation();
      fetch('/label/bulk', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, window_title: windowTitle, label })
      }).then(r => r.json()).then(d => {
        if (d.success) {
          winGroup.querySelectorAll('.ts-row').forEach(tsRow => {
            const mismatch = label !== tsRow.dataset.predicted;
            const badge = tsRow.querySelector('.ts-badge');
            badge.className = `badge ts-badge ${mismatch ? 'mismatch' : label}`;
            badge.textContent = label + (mismatch ? ' !' : '');
            tsRow.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            tsRow.querySelector(`.btn-${label}`).classList.add('active');
          });
          const winBadge = winGroup.querySelector('.win-badge');
          winBadge.className = `badge win-badge ${label}`;
          winBadge.textContent = label;
          winGroup.querySelectorAll('.bulk-btn').forEach(b => b.classList.remove('active'));
          winGroup.querySelector(`.bulk-btn-${label}`).classList.add('active');
        }
      });
    }

    function toggleApp(row) {
      const chevron = row.querySelector('.app-chevron');
      const list = row.nextElementSibling;
      const open = list.style.display === 'block';
      list.style.display = open ? 'none' : 'block';
      chevron.classList.toggle('open', !open);
    }

    function toggleWindow(header) {
      const winGroup = header.closest('.window-group');
      const chevron = header.querySelector('.window-chevron');
      const list = winGroup.querySelector('.timestamp-list');
      const open = list.style.display === 'block';
      list.style.display = open ? 'none' : 'block';
      chevron.classList.toggle('open', !open);
    }

    function renderLogs(container, rows, sessionId) {
      container.innerHTML = '';
      if (!rows || rows.length === 0) {
        container.innerHTML = '<div class="loading">no logs for this session</div>';
        return;
      }
      const grouped = groupLogs(rows);
      Object.values(grouped).forEach(appData => {
        const allEntries = Object.values(appData.windows).flatMap(w => w.entries);
        const dominant = dominantLabel(allEntries);

        const appGroup = document.createElement('div');
        appGroup.className = 'app-group';

        const appRow = document.createElement('div');
        appRow.className = 'app-row';
        appRow.addEventListener('click', () => toggleApp(appRow));
        appRow.innerHTML = `
          <span class="app-chevron">▶</span>
          <span class="app-name">${appData.name}</span>
          <span class="app-switch-count">${allEntries.length}x</span>
          <span class="badge ${dominant}">${dominant}</span>
        `;
        appGroup.appendChild(appRow);

        const winList = document.createElement('div');
        winList.className = 'window-list';

        Object.values(appData.windows).forEach(winData => {
          const winDominant = dominantLabel(winData.entries);
          const allStudy = winData.entries.every(e => (e.user_label || e.predicted_label) === 'study');
          const allDistract = winData.entries.every(e => (e.user_label || e.predicted_label) === 'distract');

          const winGroup = document.createElement('div');
          winGroup.className = 'window-group';

          const winRow = document.createElement('div');
          winRow.className = 'window-row';

          const winHeader = document.createElement('div');
          winHeader.className = 'window-header';
          winHeader.innerHTML = `
            <span class="window-chevron">▶</span>
            <span class="window-title" title="${winData.title}">${winData.title}</span>
            <span class="window-switch-count">${winData.entries.length}x</span>
            <span class="badge win-badge ${winDominant}">${winDominant}</span>
          `;
          winHeader.addEventListener('click', () => toggleWindow(winHeader));

          const btnGroup = document.createElement('div');
          btnGroup.className = 'btn-group';

          const btnStudy = document.createElement('button');
          btnStudy.className = `btn btn-study bulk-btn bulk-btn-study ${allStudy ? 'active' : ''}`;
          btnStudy.textContent = 'all study';
          btnStudy.addEventListener('click', (e) => bulkLabel(e, sessionId, winData.title, 'study', winGroup));

          const btnDistract = document.createElement('button');
          btnDistract.className = `btn btn-distract bulk-btn bulk-btn-distract ${allDistract ? 'active' : ''}`;
          btnDistract.textContent = 'all distract';
          btnDistract.addEventListener('click', (e) => bulkLabel(e, sessionId, winData.title, 'distract', winGroup));

          btnGroup.appendChild(btnStudy);
          btnGroup.appendChild(btnDistract);
          winRow.appendChild(winHeader);
          winRow.appendChild(btnGroup);
          winGroup.appendChild(winRow);

          const tsList = document.createElement('div');
          tsList.className = 'timestamp-list';

          winData.entries.forEach(entry => {
            const label = entry.user_label || entry.predicted_label;
            const mismatch = entry.user_label && entry.user_label !== entry.predicted_label;

            const tsRow = document.createElement('div');
            tsRow.className = 'ts-row';
            tsRow.dataset.predicted = entry.predicted_label;

            const dot = document.createElement('span');
            dot.className = 'ts-dot';

            const time = document.createElement('span');
            time.className = 'ts-time';
            time.textContent = new Date(entry.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});

            const badge = document.createElement('span');
            badge.className = `badge ts-badge ${mismatch ? 'mismatch' : label}`;
            badge.textContent = label + (mismatch ? ' !' : '');

            const tsBtnGroup = document.createElement('div');
            tsBtnGroup.className = 'btn-group';

            const bStudy = document.createElement('button');
            bStudy.className = `btn btn-study ${entry.user_label === 'study' ? 'active' : ''}`;
            bStudy.textContent = 'study';
            bStudy.addEventListener('click', (e) => applyLabel(e, entry.id, 'study', tsRow));

            const bDistract = document.createElement('button');
            bDistract.className = `btn btn-distract ${entry.user_label === 'distract' ? 'active' : ''}`;
            bDistract.textContent = 'distract';
            bDistract.addEventListener('click', (e) => applyLabel(e, entry.id, 'distract', tsRow));

            tsBtnGroup.appendChild(bStudy);
            tsBtnGroup.appendChild(bDistract);
            tsRow.appendChild(dot);
            tsRow.appendChild(time);
            tsRow.appendChild(badge);
            tsRow.appendChild(tsBtnGroup);
            tsList.appendChild(tsRow);
          });

          winGroup.appendChild(tsList);
          winList.appendChild(winGroup);
        });

        appGroup.appendChild(winList);
        container.appendChild(appGroup);
      });
    }

    function toggleSession(header, sid, logsDiv) {
      const chevron = header.querySelector('.session-chevron');
      const open = logsDiv.style.display === 'block';
      if (open) {
        logsDiv.style.display = 'none';
        chevron.classList.remove('open');
      } else {
        logsDiv.style.display = 'block';
        chevron.classList.add('open');
        if (!logsDiv.dataset.loaded) {
          logsDiv.innerHTML = '<div class="loading">loading...</div>';
          fetch(`/session/${sid}/logs`).then(r => r.json()).then(rows => {
            logsDiv.dataset.loaded = '1';
            renderLogs(logsDiv, rows, sid);
          });
        }
      }
    }

    fetch('/sessions').then(r => r.json()).then(sessions => {
      const container = document.getElementById('sessions-list');
      if (sessions.length === 0) {
        container.innerHTML = '<div class="empty">no sessions yet</div>';
        return;
      }
      sessions.forEach(s => {
        const total = (s.study || 0) + (s.distract || 0);
        const focusPct = total > 0 ? Math.round((s.study / total) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'session-card';

        const header = document.createElement('div');
        header.className = 'session-header';
        header.innerHTML = `
          <div class="session-left">
            <span class="session-chevron">▶</span>
            <span class="session-id">session #${s.id}</span>
          </div>
          <span class="session-time">${fmtTime(s.start_time)} → ${s.end_time ? fmtTime(s.end_time) : 'ongoing'} (${duration(s.start_time, s.end_time)})</span>
          <div class="session-stats">
            <div class="stat"><div class="label">Total</div><div class="value muted">${total}</div></div>
            <div class="stat"><div class="label">Study</div><div class="value green">${s.study || 0}</div></div>
            <div class="stat"><div class="label">Distract</div><div class="value red">${s.distract || 0}</div></div>
            <div class="stat"><div class="label">Focus</div><div class="value yellow">${focusPct}%</div></div>
          </div>
        `;

        const logsDiv = document.createElement('div');
        logsDiv.className = 'session-logs';

        header.addEventListener('click', () => toggleSession(header, s.id, logsDiv));

        const focusBar = document.createElement('div');
        focusBar.className = 'focus-bar';
        focusBar.innerHTML = `<div class="focus-fill" style="width:${focusPct}%"></div>`;

        card.appendChild(header);
        card.appendChild(focusBar);
        card.appendChild(logsDiv);
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>

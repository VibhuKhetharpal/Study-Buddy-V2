<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Buddy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'JetBrains Mono', monospace; background: #0d1117; color: #e6edf3; padding: 2rem; }
    nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
    nav a { font-size: 0.8rem; color: #8b949e; text-decoration: none; letter-spacing: 0.05em; }
    nav a.active { color: #7ee787; }
    nav a:hover { color: #e6edf3; }
    h1 { font-size: 1.2rem; font-weight: 500; color: #7ee787; margin-bottom: 2rem; letter-spacing: 0.05em; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .card .value { font-size: 1.8rem; font-weight: 500; }
    .green { color: #7ee787; }
    .red { color: #f85149; }
    .yellow { color: #e3b341; }
    .muted { color: #8b949e; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; color: #8b949e; font-weight: 400; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #161b22; color: #c9d1d9; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
    .badge.study { background: #1a3a2a; color: #7ee787; }
    .badge.distract { background: #3a1a1a; color: #f85149; }
    .badge.mismatch { background: #3a2a10; color: #e3b341; }
    .title-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8b949e; }
    .btn-group { display: flex; gap: 0.4rem; }
    .btn { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-family: inherit; cursor: pointer; border: 1px solid transparent; background: transparent; }
    .btn-study { color: #7ee787; border-color: #1a3a2a; }
    .btn-study:hover, .btn-study.active { background: #1a3a2a; }
    .btn-distract { color: #f85149; border-color: #3a1a1a; }
    .btn-distract:hover, .btn-distract.active { background: #3a1a1a; }
    .empty { color: #484f58; font-size: 0.8rem; padding: 1rem 0.75rem; }
    .session-info { font-size: 0.7rem; color: #484f58; margin-bottom: 1rem; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="/dashboard" class="active">dashboard</a>
    <a href="/history">history</a>
  </nav>

  <h1>study_buddy / dashboard</h1>

  <div class="cards">
    <div class="card"><div class="label">Total Logs</div><div class="value" id="total">—</div></div>
    <div class="card"><div class="label">Study</div><div class="value green" id="study">—</div></div>
    <div class="card"><div class="label">Distract</div><div class="value red" id="distract">—</div></div>
    <div class="card"><div class="label">Corrected</div><div class="value yellow" id="corrected">—</div></div>
    <div class="card"><div class="label">Model Mistakes</div><div class="value muted" id="mistakes">—</div></div>
  </div>

  <div class="session-info" id="session-info">loading latest session...</div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>App</th><th>Window Title</th><th>Predicted</th><th>User Label</th><th>Correct</th>
      </tr>
    </thead>
    <tbody id="log-rows"></tbody>
  </table>

  <script>
    let currentSessionId = null;

    function applyLabel(logId, label, row) {
      fetch('/label', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: logId, label })
      }).then(r => r.json()).then(d => {
        if (d.success) {
          const cell = row.querySelector('.user-label-cell');
          const mismatch = label !== row.dataset.predicted;
          cell.innerHTML = `<span class="badge ${mismatch ? 'mismatch' : label}">${label}${mismatch ? ' !' : ''}</span>`;
          row.querySelector('.btn-study').classList.toggle('active', label === 'study');
          row.querySelector('.btn-distract').classList.toggle('active', label === 'distract');
        }
      });
    }

    function loadSessionLogs(sid) {
      fetch(`/session/${sid}/logs`).then(r => r.json()).then(rows => {
        const tbody = document.getElementById('log-rows');
        tbody.innerHTML = '';
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">no logs for this session yet</td></tr>';
          return;
        }
        rows.forEach(row => {
          const mismatch = row.user_label && row.user_label !== row.predicted_label;
          const userBadge = row.user_label
            ? `<span class="badge ${mismatch ? 'mismatch' : row.user_label}">${row.user_label}${mismatch ? ' !' : ''}</span>`
            : '<span style="color:#484f58">—</span>';
          const tr = document.createElement('tr');
          tr.dataset.predicted = row.predicted_label;
          tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.app_name}</td>
            <td class="title-cell" title="${row.window_title}">${row.window_title}</td>
            <td><span class="badge ${row.predicted_label}">${row.predicted_label}</span></td>
            <td class="user-label-cell">${userBadge}</td>
            <td>
              <div class="btn-group">
                <button class="btn btn-study ${row.user_label === 'study' ? 'active' : ''}" onclick="applyLabel(${row.id}, 'study', this.closest('tr'))">study</button>
                <button class="btn btn-distract ${row.user_label === 'distract' ? 'active' : ''}" onclick="applyLabel(${row.id}, 'distract', this.closest('tr'))">distract</button>
              </div>
            </td>`;
          tbody.appendChild(tr);
        });
      });
    }

    function loadStats() {
      fetch('/stats').then(r => r.json()).then(d => {
        document.getElementById('total').textContent = d.total;
        document.getElementById('study').textContent = d.study;
        document.getElementById('distract').textContent = d.distract;
        document.getElementById('corrected').textContent = d.corrected;
        document.getElementById('mistakes').textContent = d.mistakes;
      });
    }

    function init() {
      loadStats();
      fetch('/latest_session').then(r => r.json()).then(d => {
        if (!d.session_id) {
          document.getElementById('session-info').textContent = 'no sessions yet';
          return;
        }
        currentSessionId = d.session_id;
        document.getElementById('session-info').textContent = `showing session #${currentSessionId}`;
        loadSessionLogs(currentSessionId);
        setInterval(() => {
          loadStats();
          loadSessionLogs(currentSessionId);
        }, 5000);
      });
    }

    init();
  </script>
</body>
</html>

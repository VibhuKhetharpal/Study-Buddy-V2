<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Buddy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'JetBrains Mono', monospace; background: #0d1117; color: #e6edf3; padding: 2rem; }
    h1 { font-size: 1.2rem; font-weight: 500; color: #7ee787; margin-bottom: 2rem; letter-spacing: 0.05em; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .card .value { font-size: 1.8rem; font-weight: 500; }
    .green { color: #7ee787; }
    .red { color: #f85149; }
    .yellow { color: #e3b341; }
    .muted { color: #8b949e; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; color: #8b949e; font-weight: 400; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #161b22; color: #c9d1d9; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
    .badge.study { background: #1a3a2a; color: #7ee787; }
    .badge.distract { background: #3a1a1a; color: #f85149; }
    .badge.mismatch { background: #3a2a10; color: #e3b341; }
    .title-cell { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8b949e; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <h1>study_buddy / dashboard</h1>

  <div class="cards">
    <div class="card"><div class="label">Total Logs</div><div class="value" id="total">—</div></div>
    <div class="card"><div class="label">Study</div><div class="value green" id="study">—</div></div>
    <div class="card"><div class="label">Distract</div><div class="value red" id="distract">—</div></div>
    <div class="card"><div class="label">Corrected</div><div class="value yellow" id="corrected">—</div></div>
    <div class="card"><div class="label">Model Mistakes</div><div class="value muted" id="mistakes">—</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>App</th><th>Window Title</th><th>Predicted</th><th>User Label</th>
      </tr>
    </thead>
    <tbody id="log-rows"></tbody>
  </table>

  <script>
    fetch('/stats')
      .then(r => r.json())
      .then(d => {
        document.getElementById('total').textContent = d.total;
        document.getElementById('study').textContent = d.study;
        document.getElementById('distract').textContent = d.distract;
        document.getElementById('corrected').textContent = d.corrected;
        document.getElementById('mistakes').textContent = d.mistakes;

        const tbody = document.getElementById('log-rows');
        d.recent.forEach(row => {
          const mismatch = row.user_label && row.user_label !== row.predicted_label;
          const userBadge = row.user_label
            ? `<span class="badge ${mismatch ? 'mismatch' : row.user_label}">${row.user_label}${mismatch ? ' !' : ''}</span>`
            : '<span style="color:#484f58">—</span>';
          tbody.innerHTML += `
            <tr>
              <td>${row.id}</td>
              <td>${row.app_name}</td>
              <td class="title-cell" title="${row.window_title}">${row.window_title}</td>
              <td><span class="badge ${row.predicted_label}">${row.predicted_label}</span></td>
              <td>${userBadge}</td>
            </tr>`;
        });
      });
  </script>
</body>
</html>
